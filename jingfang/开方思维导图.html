<title>经方开方思维导图</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* Layout: one-screen app. A bar (name, search, view switch) over a pan-and-zoom mind map; the chosen topic opens a sheet at the side (at the bottom on phones). The outline view shows the same tree as nested lists. Palette: celadon paper, ink, and nine mineral pigments, one per 方阵. */
:root {
  --paper: #EDF1EC;
  --surface: #FAFCFA;
  --ink: #1C2220;
  --muted: #59645E;
  --rule: #CBD4CE;
  --focus: #2F5D8C;
  --shadow: 0 12px 32px rgba(18, 28, 24, .16);
  --c-flow: #3B4642;
  --c-logic: #2F5D8C;
  --c-review: #7E6A16;
  --c-m1: #2A7863;
  --c-m2: #9A5F27;
  --c-m3: #B03E2C;
  --c-m4: #67588C;
  --c-m5: #33579C;
  --c-m6: #AA4360;
  --c-m7: #2A7186;
  --c-m8: #863A60;
  --c-m9: #4B5767;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111614; --surface: #19201D; --ink: #E3E9E5; --muted: #9AA79F; --rule: #2C3632; --focus: #88AADA;
    --shadow: 0 12px 32px rgba(0, 0, 0, .45);
    --c-flow: #B9C5BF; --c-logic: #81A4D4; --c-review: #CDB955;
    --c-m1: #62BEA3; --c-m2: #D79F5D; --c-m3: #E57E6B; --c-m4: #AC9BD5; --c-m5: #87A3DF;
    --c-m6: #E48BA4; --c-m7: #67B5CC; --c-m8: #D58DB3; --c-m9: #A6B2C3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111614; --surface: #19201D; --ink: #E3E9E5; --muted: #9AA79F; --rule: #2C3632; --focus: #88AADA;
  --shadow: 0 12px 32px rgba(0, 0, 0, .45);
  --c-flow: #B9C5BF; --c-logic: #81A4D4; --c-review: #CDB955;
  --c-m1: #62BEA3; --c-m2: #D79F5D; --c-m3: #E57E6B; --c-m4: #AC9BD5; --c-m5: #87A3DF;
  --c-m6: #E48BA4; --c-m7: #67B5CC; --c-m8: #D58DB3; --c-m9: #A6B2C3;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
button { font: inherit; }
.app { height: 100%; display: flex; flex-direction: column; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--rule); position: relative; z-index: 15; }
.brand { min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: .06em; text-wrap: balance; }
.brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
.search { position: relative; flex: 1 1 240px; min-width: 0; max-width: 420px; }
.search input { box-sizing: border-box; width: 100%; height: 36px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; }
.search input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.results { position: absolute; top: 42px; left: 0; right: 0; z-index: 30; max-height: 62vh; overflow: auto; padding: 4px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); }
.results button { display: block; width: 100%; padding: 8px 10px; border: 0; border-radius: 6px; background: none; color: var(--ink); text-align: left; cursor: pointer; }
.results button:hover, .results button:focus-visible { background: var(--paper); outline: none; }
.results .r-t { font-family: var(--font-display); font-weight: 600; }
.results .r-s { color: var(--muted); font-size: 12px; margin-left: 6px; }
.results .r-p { display: block; margin-top: 2px; color: var(--muted); font-size: 11.5px; }
.results .r-none { padding: 10px; color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { height: 34px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 13px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg .btn { border: 0; border-radius: 0; height: 32px; }
.seg .btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

main { position: relative; flex: 1; min-height: 0; }
#map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#map:active { cursor: grabbing; }

.node { cursor: pointer; }
.node rect.box { stroke-width: 1.2; }
.n-root rect.box { fill: var(--ink); stroke: var(--ink); }
.n-solid rect.box { fill: var(--fam); stroke: var(--fam); }
.n-mid rect.box { fill: color-mix(in srgb, var(--fam) 13%, var(--surface)); stroke: color-mix(in srgb, var(--fam) 62%, var(--surface)); }
.n-info rect.box { stroke-dasharray: 4 3; }
.n-leaf rect.box { fill: var(--surface); stroke: color-mix(in srgb, var(--fam) 48%, var(--surface)); }
.node text.lb { font-family: var(--font-display); font-weight: 600; fill: var(--ink); }
.n-root text.lb, .n-solid text.lb { fill: var(--surface); font-weight: 700; }
.node text.sb { font-family: var(--font-body); font-size: 11.5px; fill: var(--muted); }
.n-root text.sb, .n-solid text.sb { fill: color-mix(in srgb, var(--surface) 80%, var(--fam)); }
.node.sel rect.box { stroke: var(--fam); stroke-width: 2.8; }
.n-solid.sel rect.box, .n-root.sel rect.box { stroke: var(--focus); }
.node:focus { outline: none; }
.node:focus-visible rect.box { stroke: var(--focus); stroke-width: 3; }
.chip rect { fill: var(--surface); stroke: var(--fam); stroke-width: 1.1; }
.chip text { font-family: var(--font-display); font-size: 11px; font-weight: 700; fill: var(--fam); }
.tg circle { fill: var(--surface); stroke: var(--fam); stroke-width: 1.2; }
.tg text { font-family: var(--font-body); font-size: 10px; font-weight: 700; fill: var(--fam); pointer-events: none; }
.tg:hover circle { fill: color-mix(in srgb, var(--fam) 18%, var(--surface)); }
.link { fill: none; stroke: var(--fam); stroke-opacity: .5; stroke-width: 1.4; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 8px; color: var(--muted); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 18px; height: 11px; border-radius: 3px; border: 1px solid var(--c-m2); }
.legend .lg-solid { background: var(--c-m2); }
.legend .lg-mid { background: color-mix(in srgb, var(--c-m2) 13%, var(--surface)); }
.legend .lg-leaf { background: var(--surface); }
.legend .lg-info { background: color-mix(in srgb, var(--c-m2) 13%, var(--surface)); border-style: dashed; }
.legend b { font-family: var(--font-display); color: var(--c-m2); border: 1px solid var(--c-m2); border-radius: 3px; padding: 0 3px; font-size: 11px; }

.panel { position: absolute; top: 12px; bottom: 12px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 12; width: min(400px, 44vw); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--rule); border-top: 4px solid var(--fam); border-radius: 12px; box-shadow: var(--shadow); }
.p-head { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px 4px 16px; }
.crumbs { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; color: var(--muted); font-size: 12px; line-height: 1.6; }
.crumbs button { padding: 0; border: 0; background: none; color: var(--muted); cursor: pointer; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.crumbs button:hover { color: var(--ink); }
.close { flex: none; width: 30px; height: 30px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer; }
.p-body { flex: 1; min-height: 0; overflow: auto; padding: 2px 18px 20px; }
.p-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.p-title h2 { margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 700; line-height: 1.35; text-wrap: balance; }
.p-tag { padding: 1px 7px; border: 1px solid var(--fam); border-radius: 4px; color: var(--fam); font-family: var(--font-display); font-size: 12px; font-weight: 600; }
.lead { margin: 8px 0 0; color: var(--muted); line-height: 1.65; }
.sec { margin-top: 16px; }
.sec h3 { margin: 0 0 6px; color: var(--fam); font-size: 12px; font-weight: 700; letter-spacing: .1em; }
.sec p { margin: 0 0 6px; line-height: 1.8; }
.sec ul { margin: 0 0 6px; padding-left: 1.2em; line-height: 1.8; }
.src { color: var(--muted); font-size: 11.5px; }
.herbs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.herb { display: inline-flex; align-items: baseline; gap: 4px; padding: 3px 8px; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; }
.herb b { font-family: var(--font-display); font-weight: 600; }
.herb span { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.herb i { color: var(--muted); font-size: 11.5px; font-style: normal; }
.herb-note { color: var(--muted); font-size: 12.5px; align-self: center; }
.comp-name { margin: 10px 0 4px; font-family: var(--font-display); font-weight: 600; }
.comp-from { margin-top: 4px; color: var(--muted); font-size: 11.5px; }
.missing { color: var(--muted); }
.go { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; padding: 7px 12px; border: 1px solid var(--fam); border-radius: 8px; background: color-mix(in srgb, var(--fam) 10%, var(--surface)); color: var(--ink); cursor: pointer; }
.kids { display: grid; gap: 6px; }
.kid { display: block; width: 100%; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); text-align: left; cursor: pointer; }
.kid:hover { border-color: var(--fam); }
.kid b { display: block; font-family: var(--font-display); font-weight: 600; }
.kid span { color: var(--muted); font-size: 12px; }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; }
.srcs span { padding: 1px 7px; border: 1px solid var(--rule); border-radius: 999px; color: var(--muted); font-size: 11.5px; }

.outline { position: absolute; inset: 0; overflow: auto; padding-block: 16px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.with-panel .outline { padding-right: calc(min(400px, 44vw) + 40px); }
.outline .o-root { max-width: 920px; }
.outline details { margin-left: 12px; padding-left: 12px; border-left: 2px solid color-mix(in srgb, var(--fam) 35%, var(--paper)); }
.outline .o-root > details { margin-left: 0; padding-left: 0; border-left: 0; }
.outline summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 6px 0; cursor: pointer; list-style: none; }
.outline summary::-webkit-details-marker { display: none; }
.outline summary::before { content: "▸"; color: var(--fam); width: 1em; flex: none; }
.outline details[open] > summary::before { content: "▾"; }
.o-t { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.o-s { color: var(--muted); font-size: 12.5px; }
.o-info { margin-left: auto; padding: 2px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--muted); font-size: 12px; cursor: pointer; }
.o-leaf { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; width: 100%; margin: 2px 0; padding: 6px 10px; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--ink); text-align: left; cursor: pointer; }
.o-leaf:hover, .o-leaf.on { border-color: var(--rule); background: var(--surface); }
.o-leaf .o-t { font-size: 14.5px; }
.o-chip { padding: 0 4px; border: 1px solid var(--fam); border-radius: 3px; color: var(--fam); font-family: var(--font-display); font-size: 11px; font-weight: 700; }

@media (max-width: 720px) {
  .brand p { display: none; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 62%; border-radius: 14px 14px 0 0; border-left: 0; border-right: 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .p-head { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .p-body { padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
  .with-panel .outline { padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 62vh; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>经方开方思维导图</h1>
      <p>看病流程 → 选法 → 九个方阵里选方 → 复诊守转。点节点展开，旁边显示什么情况用、不用转到哪、原方组成。</p>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="搜方名或症状，如 小品黄芪汤、按肿、痤疮" autocomplete="off" aria-label="搜索方名或症状">
      <div id="results" class="results" role="listbox" hidden></div>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="视图">
        <button id="v-map" class="btn" aria-pressed="true">导图</button>
        <button id="v-outline" class="btn" aria-pressed="false">大纲</button>
      </div>
      <button id="b-fit" class="btn">适应屏幕</button>
      <button id="b-reset" class="btn">收起</button>
      <button id="b-all" class="btn">全部展开</button>
    </div>
  </header>
  <main id="main">
    <svg id="map" role="tree" aria-label="开方思维导图"></svg>
    <div id="outline" class="outline" hidden></div>
    <aside id="panel" class="panel" hidden aria-live="polite">
      <div class="p-head">
        <nav id="crumbs" class="crumbs" aria-label="位置"></nav>
        <button id="p-close" class="close" aria-label="关闭">×</button>
      </div>
      <div id="p-body" class="p-body"></div>
    </aside>
  </main>
</div>

<script>
const DATA = {"id":"root","k":"root","t":"怎么开方","s":"流程 → 选法 → 方阵里选方 → 复诊","d":"这张图按《方阵定位表》《经典经方体系与看病流程》和曹老经方 skill 整理。\n点节点展开下一层；点开的节点在旁边显示：什么情况用、不用或转到哪张、原方组成和出处。\n出处：〔伤〕伤寒论讲义笔记；〔金〕金匮要略笔记；〔酸〕酸药法要；〔痹〕血痹分阴阳；〔厥〕厥阴中风三法；〔skill〕曹老医案统计；〔导〕你的思维导图。","children":[{"id":"a-flow","k":"branch","t":"一、看病流程","s":"先走完这几步，再选法","d":"每一步都写判据。错题复盘时，按这几步查是哪一步错了。","children":[{"id":"n236","k":"step","t":"0　问来路","s":"起病几日、传到哪一步、用过什么治法","d":"问发过汗、服过退烧药（津已亏，葛根汤比麻黄汤常用）、攻下过（伤胃）、清热过（伤阳）、温补过（易化热）；是否手术后、产后、大病后（津血骤亏）〔伤〕〔金〕。\n复诊先问上诊方、剂数、实际服药天数、有无外感、西药（尤其激素）变化，再和上诊对比：是病进，还是里邪出表〔skill〕。\n首诊问既往用过什么方、效果如何；曹老常复用有效的旧方〔skill〕。"},{"id":"n237","k":"step","t":"1　四诊与他觉","s":"扪手、下睑、腹按、下肢四项必查","d":"问诊先里后表：寐、情绪；寒热、汗、身、疲劳；头、心、胸；口、饮、咽、鼻、咳；纳、胃；二便；经带〔skill〕。\n他觉：扪手（凉温热、潮干）、脉、舌、面、下睑（淡白、淡红、半红半白、红鲜、暗红）、腹按（软、满、薄拘、痞硬、压痛）、下肢（干燥、甲错、血络、按肿）。缺这四项时判断可靠性明显下降〔skill〕。\n病人自诉的寒热，要用扪手、下睑、舌脉校对〔伤〕。"},{"id":"n238","k":"step","t":"2　基础病机三行","s":"表／太阴／阳明，每项写依据","d":"阳明每项标虚实：睑淡白、唇舌淡、手凉＝虚热；睑红鲜、舌唇红、面赤＝实热〔skill〕。\n口干而饮少、喜温是热不实；消水、喜冷饮才是实热〔酸〕。","children":[{"id":"n1","k":"info","t":"表","s":"表束、表寒、中风、伤营、伤精","d":"表束：怕风、吹风周身不适、头胀头晕、心慌胸闷、颈腰肢体酸痛、行走不稳、鼻塞、面部油腻、肢体不用\n表寒：怕冷、手足凉、他觉身凉、下肢凉\n中风：易汗、汗后凉或怕风、手潮、盗汗、食汗\n伤营：眠差、多梦、入睡难、手足或周身麻木、记忆力差、夜间恐惧、皮损\n伤精：肌肉萎缩、羸瘦、遗精、不孕不育"},{"id":"n2","k":"info","t":"太阴","s":"里虚、里寒、水饮、伤血、血少","d":"里虚：纳差、腹胀、嘈杂、便日 1–2 行偏软或稀、饮酒或食凉后便溏\n里寒：腹凉、小腹畏寒、食凉胃闷或胃痛\n水饮：夜尿、尿频、袜痕、按肿、目下卧蚕、白痰、流涎、带下、反酸、面肿\n伤血：下肢血络、经色暗或有血块、刷牙出血、舌紫红、目眶暗黑\n血少：下睑淡白、面色萎黄或晄白、经少"},{"id":"n3","k":"info","t":"阳明","s":"里热、里结、里燥、外热、外结、外燥、水热","d":"里热：口干、口苦、口臭、渴而饮多、牙痛、燥热\n里结：腹满膨隆、腹硬满、大便 2 日一行、腹薄拘\n里燥：大便干燥难解\n外热：自觉发热、手温、皮疹红\n外结：皮损突起、火痤血痤、色斑、瘀斑、破溃\n外燥：下肢甲错、皮肤干燥、脱屑\n水热：尿灼热、烧心"}]},{"id":"n239","k":"step","t":"3　约分","s":"先表，再太阴，以太阴校阳明","d":"表上后一层包前一层（表寒 → 中风 → 伤营 → 伤精），见伤营就治伤营；太阴后一层由前一层引起（溢饮 ← 淡饮 ← 胃虚 ← 里寒），治最前一层〔skill〕。\n热从哪里来就从哪里解：表寒郁热用辛温发散；津血虚寒以虚为主的虚热用甘温补益；以寒为主的虚热用辛热；水饮郁而化火用酸温；实火才用阳明四法〔伤〕〔厥〕。\n表证三层面：二便、经带先出问题 → 外证，纯治里，不可攻表；对外邪敏感（恶风、受凉加重、无汗身痛）→ 有表邪，发表为主；两样都没有而表证明显 → 里邪冲逆，治里为主、兼顾表〔skill〕。\n主诉看\"主诉\"一栏；lmp 和月经一栏是例行记录，不当第一层〔skill〕。"},{"id":"n240","k":"step","t":"4　复合病机","s":"六病；半病门槛；少阳还是厥阴","d":"三观定位：表里（病位）、正邪（胃气是病传关口）、津液〔skill〕。\n中风：以表（上焦）为所急所苦，并有汗出、营卫不和〔伤〕。\n半病门槛：有胃虚，又有两个方向相反、要分头对治的需要（滋胃津又化饮、补虚又去实、要解表而人虚）〔skill〕。\n以上焦表位火证为苦、1–3 日即传 → 少阳；以下焦里位水证血证为苦、缠绵 → 厥阴。厥阴要有表证；口苦而胃和不先想小柴胡汤〔skill〕。\n真厥阴（手肘以上也凉、肤冷、躁无暂安、脉微欲绝）要回阳，禁解表；被水火气血阻碍而厥的是类厥阴〔伤〕〔厥〕。"},{"id":"n241","k":"step","t":"5　四证","s":"第一层属水火气血哪一证","d":"定第一层、兼证和水火比例。辨出某一经后，一定要落实到水火气血上才算瞄准：同是太阴，水证用肾著汤，血证用黄芪建中汤〔厥〕。\n咽中痰滞、苔白腻、便偏稀而又口干脉滑，是饮为本、热为标，先化痰饮〔skill〕。\n胸闷气短、胃胀等气饮层为所急所苦时，按肿退到第二层〔skill〕。"},{"id":"n242","k":"step","t":"6　关卡","s":"阳旦排除、关键药准入、黄芪门槛","d":"阳旦排除：火证为苦、里阳盛、外证、真厥阴、表上红肿热盛、手足温热便干渴饮多〔skill〕。\n关键药准入〔skill〕：\n- 麻黄：表之津液实（有汗也可）；以血虚为苦、睑红干枯、胃虚而表上有水不用。\n- 石膏：阳明里实热基础；里虚寒易动不用。\n- 柴胡：三焦不利、上焦郁火；水结重、水寒为主、真阴虚而火为苦不用。\n- 前胡：虚人之表、水火夹杂、胃虚。\n- 桂枝：表寒、营卫不和；外证、火证、里阳盛不用。\n- 黄芪：有表证或水湿；实火重时不配桂枝。\n- 人参：有里证或胃虚。芍药：津血虚、虚热、利小便；下后表寒入里、胃气弱、表寒重去芍。\n- 茯苓：下焦饮停；外证、火证有水、胃津虚之水不用。\n- 附子：有少阴证。饴糖：胃津绝对亏虚；里实里热苔腻有饮不用。栀子：火兼虚水表；旧微溏不用。\n黄芪门槛：下肢按肿＋太阴中风底子（疲劳、乏力、易汗、恶风、睑白之一）；每诊重过〔skill〕。\n里急先救里〔伤〕。"},{"id":"n243","k":"step","t":"7　定法三刀","s":"二旦 → 表药 → 四证内的法","d":"第一刀定阴阳方向，第二刀用表药定病位，第三刀在水火气血里定具体的法。每一刀都写判据，逐一写邻法为什么不用〔skill〕。","link":"b-3dao"},{"id":"n244","k":"step","t":"8　定方","s":"进方阵 → 选行 → 选列 → 核格","d":"进方阵（按复合病机、来路）→ 选行（表证性质＋里证组合定基础方）→ 选列（水火气血哪一个是第一层）→ 核格（方眼在不在、有没有反指征，不合就按分界移格）。\n落到一张现成古方，原方原量，不临时堆药〔伤〕。\n剂量 1 两≈6g，按原方原量写。减量只在资料写明的场合：合方减半为主〔厥〕；方太猛、太苦或太贵（厚朴七物汤、黄连阿胶汤）〔金〕〔伤〕；看病情（温经汤治痛经多半量、治不孕多全量）〔伤〕；首次试探（橘皮汤先半量）〔伤〕；两味药的小方用全量〔金〕；小儿酌减。","link":"c-matrices"},{"id":"n245","k":"step","t":"9　邻方对照","s":"方眼在否、反指征、管不管第一层","d":"前 3–4 张候选方各写一行：方眼在不在、反指征有没有、管不管得到所急所苦和第一层。有反指征或管不到第一层的方不能排第一〔skill〕。\n几张都说得通时，首诊先选更轻、更窄、偏表或偏中焦祛邪的那张，补益养血留给复诊〔skill〕。\n再写 1–2 张备选（换方条件、分歧在哪一刀），和 1–2 个能推翻判断的追问，优先问他觉和来路〔skill〕。"},{"id":"n246","k":"step","t":"10　排方与复诊","s":"依病传排方；守还是转","d":"一诊可开 2–7 张方，按顺序服或交替服：阳病两三日一传，2–2 交替；阴病四至六日一传，4–4 或 5–5 交替。交替服的两张方方向相反，不能合成一方〔厥〕〔痹〕。\n常见顺序：先纠虚后攻实；先发表再清降；清火之后虚寒显，用前胡法收尾；温补之后热显，转清法；温里之后适时解表〔厥〕〔痹〕。","link":"d-review"}],"fam":"flow"},{"id":"b-choose","k":"branch","t":"二、选法：进哪个方阵","s":"按复合病机或来路；再用三刀定法","d":"先用复合病机或来路决定进哪个方阵，再用定法三刀核对：二旦定方向，表药定病位，四证定具体的法。","children":[{"id":"n282","k":"fa","t":"按复合病机进方阵","s":"九种复合病机对应九个方阵","children":[{"id":"n247","k":"route","t":"少阳中风、厥阴中风","s":"→ 方阵一：厥阴中风三法","d":"少阳中风、厥阴中风 → 方阵一：厥阴中风三法","link":"m1"},{"id":"n248","k":"route","t":"太阴中风、血痹（在表）","s":"→ 方阵二：太阴中风·辛温血痹（黄芪族）","d":"太阴中风、血痹（在表） → 方阵二：太阴中风·辛温血痹（黄芪族）","link":"m2"},{"id":"n249","k":"route","t":"阳明实火","s":"→ 方阵三：阳明四法","d":"阳明实火 → 方阵三：阳明四法","link":"m3"},{"id":"n250","k":"route","t":"类厥阴本病","s":"→ 方阵四：泻心·乌梅","d":"类厥阴本病 → 方阵四：泻心·乌梅","link":"m4"},{"id":"n251","k":"route","t":"太阳表证","s":"→ 方阵五：太阳","d":"太阳表证 → 方阵五：太阳","link":"m5"},{"id":"n252","k":"route","t":"阳明表热、阳明血痹","s":"→ 方阵六：辛寒血痹·表解肌","d":"阳明表热、阳明血痹 → 方阵六：辛寒血痹·表解肌","link":"m6"},{"id":"n253","k":"route","t":"太阴里证（虚寒、水饮、胃气）","s":"→ 方阵七：太阴温之四法·水饮","d":"太阴里证（虚寒、水饮、胃气） → 方阵七：太阴温之四法·水饮","link":"m7"},{"id":"n254","k":"route","t":"太阴伤血、虚劳","s":"→ 方阵八：建中·血","d":"太阴伤血、虚劳 → 方阵八：建中·血","link":"m8"},{"id":"n255","k":"route","t":"少阴","s":"→ 方阵九：少阴","d":"少阴 → 方阵九：少阴","link":"m9"},{"id":"n256","k":"route","t":"真厥阴","s":"→ 四逆辈","d":"真厥阴 → 四逆辈：要回阳，禁解表〔伤〕。"}]},{"id":"n283","k":"fa","t":"按来路直接定位","s":"来路决定去路","d":"来路决定去路：从太阴传入的走寒疝、虚劳方向（方阵二、方阵八）；从阳明传入的走痈脓、肠痈、阴阳毒方向（方阵六）。〔痹〕〔厥〕","children":[{"id":"n257","k":"route","t":"太阳表不解＋胃虚","s":"→ 少阳中风：柴胡桂枝汤","d":"太阳表不解＋胃虚 → 少阳中风：柴胡桂枝汤〔厥〕","link":"n6"},{"id":"n258","k":"route","t":"上一条再加胃寒（里寒）","s":"→ 厥阴中风：前胡桂枝汤（竹叶前胡汤）","d":"上一条再加胃寒（里寒） → 厥阴中风：前胡桂枝汤（竹叶前胡汤）〔厥〕","link":"n25"},{"id":"n259","k":"route","t":"再虚热转实，里阳盛去桂","s":"→ 前胡升麻地黄汤","d":"再虚热转实，里阳盛去桂 → 前胡升麻地黄汤〔厥〕","link":"n34"},{"id":"n260","k":"route","t":"太阴里阳虚＋寒饮","s":"→ 前胡苓桂术甘汤","d":"太阴里阳虚＋寒饮 → 前胡苓桂术甘汤〔厥〕","link":"n26"},{"id":"n261","k":"route","t":"少阴卫阳虚＋里热","s":"→ 前胡桂枝附子汤","d":"少阴卫阳虚＋里热 → 前胡桂枝附子汤〔厥〕","link":"n35"},{"id":"n262","k":"route","t":"太阴虚热转实（黄汗层）","s":"→ 芪芍桂酒汤","d":"太阴虚热转实（黄汗层） → 芪芍桂酒汤〔厥〕","link":"n71"},{"id":"n263","k":"route","t":"阳明虚实夹杂（大病后劳复）","s":"→ 枳实栀子豉汤","d":"阳明虚实夹杂（大病后劳复） → 枳实栀子豉汤〔厥〕","link":"n102"}]},{"id":"b-3dao","k":"fa","t":"定法三刀","s":"二旦 → 表药 → 四证内的法","children":[{"id":"n268","k":"fa","t":"第一刀：二旦","s":"阳旦、阴旦，还是二旦合","children":[{"id":"n264","k":"info","t":"阳旦","s":"气的温煦不足而见寒：桂枝、黄芪","d":"阳旦层级：桂枝甘草 → 桂枝汤 → 建中 → 青龙 → 续命 → 石散。\n太阴中风四层（后层包前层）：邪风虚热（桂枝汤）→ 水饮血痹（桂枝加黄芪汤）→ 邪风血病（黄芪桂枝五物汤）→ 风水（防己黄芪汤）、黄汗（芪芍桂酒汤）〔skill〕。"},{"id":"n265","k":"info","t":"阴旦","s":"血的濡养不足而见热：柴胡、黄芩、芍药","d":"扶阴解表、从阴面解，祖方黄芩加半夏生姜汤。里热津血不足的表证见肢痛就上桂枝、黄芪，是零分错误〔skill〕。"},{"id":"n266","k":"info","t":"二旦合","s":"寒、热同为所苦","d":"柴胡桂枝汤（两方各取半量）、竹叶前胡汤。一直温则濡养不足，一直滋则温煦不足：阴旦攻下之后多转阳旦〔skill〕〔厥〕。"},{"id":"n267","k":"info","t":"阳旦排除","s":"见这些就不用桂枝、黄芪打底","d":"火证为苦、里阳盛、外证、真厥阴、表上红肿热盛、手足温热便干渴饮多。排除阳旦后，只在阴旦、解肌、泻心、二旦合里找〔skill〕。"}]},{"id":"n275","k":"fa","t":"第二刀：表药定病位","s":"麻黄、石膏葛根、柴胡、桂枝、黄芪、前胡","children":[{"id":"n269","k":"info","t":"麻黄 → 太阳","s":"表之津液实（有汗也可）","d":"不用：以血虚为苦、睑红干枯、胃虚而表上有水。实则麻黄：睑红鲜、周身疼重、腹硬满、脉浮有力〔skill〕。","link":"m5"},{"id":"n270","k":"info","t":"石膏、葛根、升麻 → 阳明表热","s":"存津液而发汗（解肌）","d":"石膏要有阳明里实热基础，里虚寒易动不用。葛根虚实兼清、偏津亏〔skill〕。","link":"m6"},{"id":"n271","k":"info","t":"柴胡 → 少阳","s":"三焦不利、上焦郁火","d":"不用：水结重、水寒为主、真阴虚而火为苦。口苦而胃和（纳可、不呕、无胃胀反酸便稀）不先想小柴胡汤〔skill〕。","link":"m1-chai"},{"id":"n272","k":"info","t":"桂枝 → 少阴","s":"表寒、营卫不和","d":"不用：外证、火证、里阳盛。桂枝汤类的方在方阵五（中风有汗）和方阵八（建中、营血虚）〔skill〕。","link":"m9"},{"id":"n273","k":"info","t":"黄芪 → 太阴","s":"太阴病之麻黄：须有表证或水湿","d":"虚则黄芪：睑淡白、面萎黄、腹软、甲错、经少。实火重时不配桂枝。黄芪配阴旦，要同时有卫气在表不温不固和津血在里不润不降〔skill〕。","link":"m2"},{"id":"n274","k":"info","t":"前胡 → 类厥阴","s":"虚人之表、水火夹杂、胃虚","d":"前胡＝不那么温热的黄芪，水药兼补〔skill〕。","link":"m1-qian"}]},{"id":"n281","k":"fa","t":"第三刀：四证内的法","s":"水、火、气、血各有其法","children":[{"id":"n276","k":"info","t":"火：实火","s":"七行多数落实火 → 阳明四法","d":"实火、阴火七行（逐行比，多数行落哪边按哪边）〔skill〕：\n- 口渴：实火口燥喜冷饮｜阴火虽渴而喜热饮，或渴饮不一\n- 大便：实火腹满便燥｜阴火虽腹满便秘而便软或无力\n- 寒热：实火恶热不恶寒｜阴火虽恶热常伴恶寒\n- 舌：实火燥、红鲜｜阴火淡、嫩、滑\n- 下睑：实火红鲜｜阴火淡白或淡红\n- 面：实火红赤｜阴火晦暗、萎黄、苍白\n- 脉：实火实｜阴火虚\n阳明四法：苦寒（里热燔灼、不兼表虚水）；辛寒（热兼表、冲上焦表位）；咸寒（燥结、血分、水分）；酸寒（火为所苦而兼虚兼水兼表，旧微溏不可）。邻法：酸寒泻实兼顾虚，甘寒治虚兼清热。","link":"m3"},{"id":"n277","k":"info","t":"火：阴火","s":"甘、酸、咸、石，各配温或寒","d":"津液虚为所苦 → 甘、酸；火热盛为主 → 咸、石。甘温不解 → 酸温 → 咸温 → 石散。虚火重时舍开柴胡、前胡（苦泄）。津虚之水不用茯苓；虚寒为本不用麦冬、天冬〔skill〕。\n虚热不适合阳明四法：辛寒更燥伤津，咸寒攻下更溏，苦寒败胃，酸寒是火证为主的类厥阴法〔skill〕。"},{"id":"n278","k":"info","t":"水","s":"淡饮为基础；实则麻黄，虚则黄芪","d":"淡药（茯苓）的前提是下焦饮停（小便不利、夜尿、泡沫）；外证禁淡药；火证有水、津燥，用猪苓、滑石、竹茹、芦根、芍药代茯苓〔skill〕。\n表为所苦先发汗，里为所苦先利小便。实则麻黄（睑红鲜、周身疼重、腹硬满、脉浮有力），虚则黄芪（睑淡白、面萎黄、腹软、甲错、经少）。胃虚为所苦先补胃〔skill〕。\n支饮：呕 → 小半夏；眩悸 → 加茯苓；冒眩 → 泽泻汤；胸满 → 厚朴大黄；喘满痞坚 → 木防己汤；咳逆倚息 → 姜辛夏味、厚朴麻黄、青龙〔skill〕。","link":"m7"},{"id":"n279","k":"info","t":"气","s":"辛药或酸药作气药","d":"表盛、寒极、胃虚兼气 → 辛药为气药；水盛、火极、血虚兼气 → 酸药为气药；火证兼气逆 → 酸药或石药，不用辛燥的橘、朴、木香〔skill〕。\n底方桂枝生姜枳实汤：偏寒 → 枳实薤白桂枝汤；偏热 → 四逆散；兼水 → 外台茯苓饮；兼火 → 枳实栀子豉汤；血虚 → 温经汤、当归建中汤；夹杂 → 竹叶前胡汤〔skill〕。"},{"id":"n280","k":"info","t":"血","s":"在表伤营，在里伤血；血痹分阴阳","d":"在表伤营（睡眠、麻木），在里伤血（月经、出血）。被寒所凝 → 太阴血痹，辛温（黄芪、桂枝、生姜 → 建中）；被热所耗 → 阳明血痹，辛寒（葛根、芍药 → 丹皮、升麻）〔痹〕〔skill〕。\n妇科从太阴血痹传入：胃气虚 → 小品甘草干姜当归大枣汤；胃津虚 → 建中；血寒 → 当归生姜羊肉汤。没有少阴证不用附子；月经量少慎用温经汤〔skill〕。\n曹老妇科四方：吴茱萸汤（纯治水）→ 当归四逆加吴茱萸生姜汤（偏水）→ 温经汤（偏血有虚热）→ 当归建中汤〔skill〕。","link":"m8"}]}]}],"fam":"logic"},{"id":"c-matrices","k":"branch","t":"三、九个方阵：法与方","s":"进方阵 → 选行 → 选列 → 核格","d":"每个方阵先看进入条件；再按行（基础方）和列（水火气血）找格子，对照方眼和反指征定方。","children":[{"id":"m1","k":"matrix","t":"方阵一：厥阴中风三法","s":"胃虚＋寒热虚实错杂，且有表证","d":"选法\n- 柴胡法：三阳传来（太阳之表、少阳胃虚、阳明火证），火证、气证偏多，热偏实。\n- 前胡法：三阴传来（少阴之表、太阴胃虚胃寒、太阴水证），偏寒、偏水、偏虚。\n- 酸药法：里证传来（阳明、太阴伤血，虚热转实），以里证、血证、虚证为所苦；表证在而不为主（例如以小便不利、腹痛就诊，他觉见袜痕、手潮），津血偏虚。\n- 柴胡与前胡：柴胡多一个清解郁火，前胡多一个散结除水。三法可以前后衔接：柴胡法清火后虚寒显，用前胡法收尾；血不足时用酸药补敛。","children":[{"id":"m1-chai","k":"fa","t":"四逆散","s":"三阳传来，偏火偏气","d":"柴胡法：三阳传来（太阳之表、少阳胃虚、阳明火证），火证、气证偏多，热偏实。","children":[{"id":"n4","k":"row","t":"柴胡桂枝汤行","s":"太阳表束＋少阳胃虚","d":"太阳表束（发热微恶寒、支节烦疼、恶风、汗出）＋少阳胃虚（微呕、心下支结）","children":[{"id":"n6","k":"fang","t":"柴胡桂枝汤","s":"伤寒六七日、发热微恶寒、支节烦疼","use":"伤寒六七日，发热微恶寒，支节烦疼，微呕，心下支结；更年期、肢体烦疼伴情志失和〔伤〕","not":"胃胀为苦，移本行气格；以火为苦，移本行火格","src":["伤"],"comp":[{"n":"柴胡桂枝汤","c":"柴胡24 黄芩9 桂枝9 芍药9 人参9 炙甘草6 生姜9 半夏12 大枣12","from":"skill"}],"tag":"基础"},{"id":"n7","k":"fang","t":"柴胡加龙骨牡蛎汤","s":"焦虑、烦躁、耳鸣、头晕、心慌","use":"胸满烦惊，小便不利，一身尽重〔伤〕；焦虑、烦躁、耳鸣、头晕、心慌、尿黄〔skill〕","not":"没有烦惊、冲逆，移大柴胡汤〔skill〕","src":["伤","skill"],"comp":[{"n":"柴胡加龙骨牡蛎汤","c":"柴胡24 黄芩9 人参9 生姜9 大枣1 的水气。\n- 再兼腰酸、疲劳、寐差多梦等伤营，就是芪芍剂（风水＋津血亏虚）：芪芍桂酒、芪芍桂瞿小豆、芪芍桂芩小豆、芪芍四逆当归、芪芍竹叶石膏、芪芍柴胡枳实丸。\n- 水饮除了就不再用黄芪，转小阳旦法（新加归地汤、桂枝新加汤）。\n- 定格用两个轴：偏水饮还是偏血痹；次要的那一头是轻还是重。\n偏水饮：次要的一头轻 → 桂枝加黄芪汤、防己黄芪汤；次要的一头重 → 黄芪桂枝五物汤（倍生姜，除水养营），下接黄芪桂枝茯苓汤、芪芍桂附归芎汤（更温）、小品黄芪汤\n偏血痹：次要的一头轻 → 小建中汤（赤芍血痹法）；次要的一头重 → 黄芪建中汤（黄芪除风水）\n- 先后：黄芪桂枝五物汤 →（出现淡饮）黄芪桂枝茯苓汤 →（水饮得除）小品黄芪汤。伤营加风水为所急所苦时首选小品黄芪汤，但苔腻、有淡饮的先用黄芪桂枝茯苓汤除水。这和上表\"心慌没了不守，多转小品黄芪汤\"一致。\n- 阴阳相对的两张：千金内补黄芪汤（淡饮＋支饮＋里虚血证，舌暗红、苔白腻）与黄芪竹叶汤（芪芍竹叶石膏汤＋四物汤，以伤营伤血为所急所苦）。\n- 风水＋里寒：黄芪配附子、干姜，或配川椒、细辛，导图把它们连到方阵一的千金柴胡桂枝茯苓丸。\n- 上表\"寒、水、火、气、血\"的方向是我按 skill 排的。导图的两个轴更根本：先用导图的轴定格，再用上表核方眼。"},{"id":"n57","k":"row","t":"基础","s":"小品黄芪汤","children":[{"id":"n56","k":"fang","t":"小品黄芪汤","s":"疲劳、多梦失眠、月经少或血块","use":"疲劳、多梦失眠、月经少或血块、睑白、下肢干燥加按肿、轻度虚热","not":"恶热、咽干、咳、喜饮，移黄芪竹叶汤；全无热而恶寒，移桂枝加黄芪汤；心慌头晕、舌胖，移黄芪桂枝茯苓汤；夜间燥热，移芪芍竹叶石膏汤","comp":[{"n":"小品黄芪汤","c":"黄芪12 桂枝12 芍药12 炙甘草12 生姜12 大枣60 黄芩6 当归12 生地12 麦冬12","from":"skill"}],"tag":"基础"}]},{"id":"n59","k":"row","t":"寒","s":"桂枝加黄芪汤、芪芍桂附归芎汤、内补黄芪汤","children":[{"id":"n58","k":"fang","t":"桂枝加黄芪汤","s":"麻木、恶风、腿膝、扪手凉","use":"麻木、恶风、腿膝、扪手凉、全无热；攻下后里实去而转阳旦","not":"便稀、脉滑不用；守方少，多转防己黄芪汤","comp":[{"n":"桂枝加黄芪汤","c":"桂枝18 芍药18 生姜18 炙甘草12 大枣24 黄芪30","from":"skill"}],"tag":"寒"},{"id":"n60","k":"fang","t":"芪芍桂附归芎汤","s":"恶寒、腹痛、关节冷痛、脉沉弱","use":"恶寒 80%、腹痛 60%、关节冷痛、脉沉弱、经淋漓","not":"脉滑不用","comp":[{"n":"芪芍桂附归芎汤","c":"黄芪12 芍药12 桂枝12 炮附子12 当归12 川芎12 炙甘草12 龙骨12 饴糖80","from":"skill"}],"tag":"寒"},{"id":"n61","k":"fang","t":"内补黄芪汤","s":"便稀、恶寒、肠鸣、多梦、咳","use":"便稀 74%、恶寒 58%、肠鸣、多梦、咳、夜尿、睑白","not":"以腹痛腹胀为主，移芪芍桂枝厚朴当归汤；胸闷气短、胃胀为苦，先用外台茯苓饮","comp":[{"n":"内补黄芪汤","c":"大枣60 干姜24 黄芪18 当归18 芍药18 半夏18 生地18 桂枝12 甘草12 茯苓12 人参12 远志12 麦冬12 五味子12 白术12 泽泻12","from":"skill"}],"tag":"寒＋水"}]},{"id":"n63","k":"row","t":"水","s":"黄芪桂枝茯苓汤、防己黄芪汤、防己茯苓汤、黄芪桂…","children":[{"id":"n62","k":"fang","t":"黄芪桂枝茯苓汤","s":"心慌、头晕、胸闷、夜尿、便稀","use":"心慌 63%、头晕、胸闷、夜尿、便稀、舌胖；主诉是痛症而兼头晕心慌胸闷、入睡难，也先用它","not":"心慌没了不守，多转小品黄芪汤；恶热、脉滑不用；无按肿而夜尿、干燥、麻木，移肾气丸","comp":[{"n":"黄芪桂枝茯苓汤","c":"黄芪18 桂枝12 茯苓12 麦冬24 五味子24 川芎12 生姜24 大枣40","from":"skill"}],"tag":"水"},{"id":"n64",     g.on('click', e => { e.stopPropagation(); touched = true; onNode(d); })
      .on('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onNode(d); } });
  }
  function paintNode(g, n) {
    const d = n.data, m = n.m;
    g.classed('sel', d === selected).attr('aria-expanded', d.children ? String(expanded.has(d.id)) : null);
    g.select('rect.box').attr('width', m.w).attr('height', m.h).attr('rx', d.k === 'root' ? m.h / 2 : 8);
    const x0 = PADX + m.chipW;
    if (m.chip) {
      const cw = m.chipW - 8;
      g.select('.chip rect').attr('x', PADX).attr('y', (m.h - CHIP) / 2).attr('width', cw).attr('height', CHIP).attr('rx', 3);
      g.select('.chip text').attr('x', PADX + cw / 2).attr('y', m.h / 2).attr('dy', '0.36em').attr('text-anchor', 'middle').text(m.chip);
    }
    const lb = g.select('text.lb').attr('x', x0).style('font-size', m.size + 'px').text(m.label);
    if (m.sub) {
      lb.attr('y', m.h / 2 - 3).attr('dy', null);
      g.select('text.sb').attr('x', x0).attr('y', m.h / 2 + 14).text(m.sub);
    } else {
      lb.attr('y', m.h / 2).attr('dy', '0.36em');
      g.select('text.sb').text('');
    }
    if (d.children) {
      g.select('.tg').attr('transform', `translate(${m.w + 12},${m.h / 2})`);
      g.select('.tg text').text(expanded.has(d.id) ? '−' : d.children.length);
    }
  }

  function update(srcId, instant) {
    const h = d3.hierarchy(DATA, d => (expanded.has(d.id) ? d.children : null));
    h.each(n => { n.m = metrics(n.data); });
    const maxW = [];
    h.each(n => { maxW[n.depth] = Math.max(maxW[n.depth] || 0, n.m.w); });
    const colX = [0];
    for (let i = 1; i < maxW.length; i++) colX[i] = colX[i - 1] + maxW[i - 1] + GAP;
    d3.tree().nodeSize([ROW, 1]).separation((a, b) => (a.parent === b.parent ? 1 : 1.3))(h);
    h.each(n => { n.X = colX[n.depth]; n.Y = n.x; });
    const nodes = h.descendants(), links = h.links();
    const src = (srcId && pos.get(srcId)) || { X: 0, Y: 0, w: 0 };
    const sx = src.X + src.w + TG, sy = src.Y;
    const T = svg.transition('layout').duration(instant ? 0 : DUR);

    gLinks.selectAll('path.link').data(links, l => l.target.data.id).join(
      enter => enter.append('path').attr('class', 'link').attr('style', l => `--fam:var(--c-${l.target.data.fam})`)
        .attr('d', curve(sx, sy, sx, sy)),
      upd => upd,
      exit => exit.call(x => x.transition(T).attr('d', curve(sx, sy, sx, sy)).remove())
    ).call(x => x.transition(T).attr('d', l => curve(l.source.X + l.source.m.w + TG, l.source.Y, l.target.X, l.target.Y)));

    const sel = gNodes.selectAll('g.node').data(nodes, n => n.data.id);
    const ent = sel.enter().append('g').attr('transform', `translate(${sx},${sy})`).attr('opacity', 0)
      .each(function (n) { buildNode(d3.select(this), n); });
    const all = ent.merge(sel);
    all.each(function (n) { paintNode(d3.select(this), n); });
    all.transition(T).attr('opacity', 1).attr('transform', n => `translate(${n.X},${n.Y - n.m.h / 2})`);
    sel.exit().transition(T).attr('opacity', 0).attr('transform', `translate(${sx},${sy})`).remove();
    pos.clear();
    nodes.forEach(n => pos.set(n.data.id, { X: n.X, Y: n.Y, w: n.m.w, h: n.m.h }));
  }
  function repaintSelection() {
    gNodes.selectAll('g.node').classed('sel', n => n.data === selected);
    document.querySelectorAll('.o-leaf.on').forEach(el => el.classList.remove('on'));
    if (selected) { const el = document.querySelector(`.o-leaf[data-id="${selected.id}"]`); if (el) el.classList.add('on'); }
  }

  // ---------- view geometry
  const main = document.getElementById('main');
  const panel = document.getElementById('panel');
  const phone = () => window.matchMedia('(max-width: 720px)').matches;
  function avail() {
    const r = svg.node().getBoundingClientRect();
    let W = r.width, H = r.height;
    if (!panel.hidden) {
      if (phone()) H = Math.max(140, H - panel.getBoundingClientRect().height);
      else W = Math.max(240, W - panel.getBoundingClientRect().width - 28);
    }
    return { W, H };
  }
  function fit(instant) {
    if (!pos.size) return;
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    pos.forEach(p => { x0 = Math.min(x0, p.X); x1 = Math.max(x1, p.X + p.w + TG + 10); y0 = Math.min(y0, p.Y - p.h / 2); y1 = Math.max(y1, p.Y + p.h / 2); });
    const { W, H } = avail();
    const k = Math.max(0.18, Math.min(1.05, (W - 48) / (x1 - x0), (H - 48) / (y1 - y0)));
    const tx = (W - (x1 - x0) * k) / 2 - x0 * k, ty = (H - (y1 - y0) * k) / 2 - y0 * k;
    svg.transition().duration(instant ? 0 : DUR * 1.4).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
  }
  function centerOn(id, withKids) {
    const p = pos.get(id);
    if (!p) return;
    const k = Math.max(d3.zoomTransform(svg.node()).k, phone() ? 0.62 : 0.72);
    const { W, H } = avail();
    let cy = p.Y;
    const d = byId.get(id);
    if (withKids && d.children && expanded.has(id)) {
      const ys = d.children.map(c => pos.get(c.id)).filter(Boolean).map(q => q.Y);
      if (ys.length) {
        const mid = (Math.min(...ys) + Math.max(...ys)) / 2;
        const lim = (H * 0.36) / k;
        cy = Math.min(p.Y + lim, Math.max(p.Y - lim, mid));
      }
    }
    const tx = Math.min(W * 0.2, 90) - p.X * k, ty = H / 2 - cy * k;
    svg.transition().duration(DUR * 1.4).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
  }

  // ---------- actions
  function collapse(d) {
    const stack = [d];
    while (stack.length) { const x = stack.pop(); expanded.delete(x.id); (x.children || []).forEach(c => stack.push(c)); }
  }
  function toggle(d) {
    if (expanded.has(d.id)) { collapse(d); update(d.id); }
    else { expanded.add(d.id); update(d.id); centerOn(d.id, true); }
  }
  function onNode(d) {
    const has = d.children && d.children.length;
    if (has && !expanded.has(d.id)) { expanded.add(d.id); select(d); update(d.id); centerOn(d.id, true); return; }
    if (has && selected === d) { collapse(d); update(d.id); return; }
    select(d);
  }
  function goTo(id) {
    const d = byId.get(id);
    if (!d) return;
    ancestors(d).forEach(a => expanded.add(a.id));
    if (view === 'map') {
      update(d.up ? d.up.id : null);
      select(d);
      centerOn(d.id, false);
    } else {
      select(d);
      openOutlinePath(d);
    }
  }

  // ---------- panel
  const body = document.getElementById('p-body');
  const crumbs = document.getElementById('crumbs');
  function select(d) {
    selected = d;
    panel.hidden = false;
    main.classList.add('with-panel');
    panel.style.setProperty('--fam', `var(--c-${d.fam})`);
    const path = ancestors(d);
    crumbs.innerHTML = path.length
      ? path.map(a => `<button data-go="${a.id}">${esc(a.t)}</button>`).join('<span aria-hidden="true">›</span>')
      : '<span>从这里开始</span>';
    let html = `<div class="p-title"><h2>${esc(d.t)}</h2>${d.tag ? `<span class="p-tag">${esc(d.tag)}</span>` : ''}</div>`;
    if (d.s) html += `<p class="lead">${rich(d.s)}</p>`;
    if (d.use) html += `<div class="sec"><h3>什么情况用</h3>${paragraphs(d.use)}</div>`;
    if (d.not) html += `<div class="sec"><h3>不用／转到</h3>${paragraphs(d.not)}</div>`;
    if (d.k === 'fang') {
      if (d.comp && d.comp.length) {
        html += '<div class="sec"><h3>组成（原方原量，g）</h3>';
        d.comp.forEach(c => {
          if (d.comp.length > 1 || c.n !== d.t) html += `<div class="comp-name">${esc(c.n)}</div>`;
          html += herbs(c.c);
        });
        html += `<div class="comp-from">来源：${esc(COMP_FROM[d.comp[0].from] || d.comp[0].from)}</div></div>`;
      } else {
        html += '<div class="sec"><h3>组成</h3><p class="missing">资料里没有这张方换算好的剂量。</p></div>';
      }
    }
    if (d.d) html += `<div class="sec"><h3>${d.k === 'fang' ? '备注' : '要点'}</h3>${paragraphs(d.d)}</div>`;
    if (d.k === 'root') {
      html += '<div class="sec"><h3>怎么看这张图</h3><div class="legend">' +
        '<span><i class="lg-solid"></i>方阵</span><span><i class="lg-mid"></i>法、行、步骤</span>' +
        '<span><i class="lg-leaf"></i>方</span><span><i class="lg-info"></i>说明</span>' +
        '<span><b>水</b><b>火</b><b>气</b><b>血</b>方所在的列</span></div>' +
        '<p>框右边圆圈里的数字是下一层有几条。点圆圈只展开或收起；点框会同时在这里显示说明。' +
        '拖动可以平移，滚轮或双指可以缩放，按 / 键直接搜索。手机上默认用「大纲」视图，点「导图」切回思维导图。</p></div>';
    }
    if (d.link && byId.has(d.link)) {
      const t = byId.get(d.link);
      html += `<div class="sec"><button class="go" data-go="${t.id}">去看：${esc(t.t)} →</button></div>`;
    }
    if (d.children && d.children.length) {
      html += `<div class="sec"><h3>下一层（${d.children.length}）</h3><div class="kids">` +
        d.children.map(c => `<button class="kid" data-go="${c.id}"><b>${esc(c.t)}</b>${c.s ? `<span>${esc(c.s)}</span>` : ''}</button>`).join('') +
        '</div></div>';
    }
    if (d.src && d.src.length) {
      html += '<div class="sec"><h3>出处</h3><div class="srcs">' +
        d.src.map(s => `<span>〔${esc(s)}〕${esc(SRC_LABEL[s] || '')}</span>`).join('') + '</div></div>';
    }
    body.innerHTML = html;
    body.scrollTop = 0;
    repaintSelection();
  }
  function closePanel() {
    selected = null;
    panel.hidden = true;
    main.classList.remove('with-panel');
    repaintSelection();
  }
  document.getElementById('p-close').addEventListener('click', closePanel);
  panel.addEventListener('click', e => {
    const b = e.target.closest('[data-go]');
    if (b) goTo(b.getAttribute('data-go'));
  });

  // ---------- outline
  const outline = document.getElementById('outline');
  function buildOutline() {
    const make = (d, depth) => {
      if (d.children && d.children.length) {
        const det = document.createElement('details');
        det.dataset.id = d.id;
        det.style.setProperty('--fam', `var(--c-${d.fam})`);
        if (START.includes(d.id)) det.open = true;
        const sum = document.createElement('summary');
        sum.innerHTML = `<span class="o-t">${esc(d.t)}</span>${d.s ? `<span class="o-s">${esc(d.s)}</span>` : ''}`;
        const info = document.createElement('button');
        info.className = 'o-info';
        info.textContent = '详情';
        info.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); select(d); });
        sum.appendChild(info);
        det.appendChild(sum);
        const box = document.createElement('div');
        d.children.forEach(c => box.appendChild(make(c, depth + 1)));
        det.appendChild(box);
        return det;
      }
      const b = document.createElement('button');
      b.className = 'o-leaf';
      b.dataset.id = d.id;
      b.style.setProperty('--fam', `var(--c-${d.fam})`);
      const chip = chipOf(d);
      b.innerHTML = `${chip ? `<span class="o-chip">${esc(chip)}</span>` : ''}<span class="o-t">${esc(d.t)}</span>${d.s ? `<span class="o-s">${esc(d.s)}</span>` : ''}`;
      b.addEventListener('click', () => select(d));
      return b;
    };
    const wrap = document.createElement('div');
    wrap.className = 'o-root';
    wrap.appendChild(make(DATA, 0));
    outline.appendChild(wrap);
  }
  function openOutlinePath(d) {
    ancestors(d).forEach(a => { const el = outline.querySelector(`details[data-id="${a.id}"]`); if (el) el.open = true; });
    const el = outline.querySelector(`[data-id="${d.id}"]`);
    if (el) el.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
  }
  function setView(v) {
    view = v;
    document.getElementById('v-map').setAttribute('aria-pressed', String(v === 'map'));
    document.getElementById('v-outline').setAttribute('aria-pressed', String(v === 'outline'));
    svg.node().style.display = v === 'map' ? '' : 'none';
    outline.hidden = v !== 'outline';
    document.getElementById('b-fit').hidden = v !== 'map';
    if (v === 'outline' && !outline.firstChild) buildOutline();
    if (v === 'outline' && selected) openOutlinePath(selected);
    if (v === 'map') { update(null, true); if (selected && pos.has(selected.id)) centerOn(selected.id, false); else fit(true); }
  }
  document.getElementById('v-map').addEventListener('click', () => setView('map'));
  document.getElementById('v-outline').addEventListener('click', () => setView('outline'));
  document.getElementById('b-fit').addEventListener('click', () => fit(false));
  document.getElementById('b-reset').addEventListener('click', () => {
    expanded = new Set(START);
    if (view === 'map') { update('root'); fit(false); }
    else outline.querySelectorAll('details').forEach(el => { el.open = START.includes(el.dataset.id); });
  });
  document.getElementById('b-all').addEventListener('click', () => {
    byId.forEach(d => { if (d.children) expanded.add(d.id); });
    if (view === 'map') { update('root'); fit(false); }
    else outline.querySelectorAll('details').forEach(el => { el.open = true; });
  });

  // ---------- search
  const q = document.getElementById('q');
  const results = document.getElementById('results');
  const flat = [];
  byId.forEach(d => flat.push(d));
  function search() {
    const term = q.value.trim();
    if (!term) { results.hidden = true; return; }
    const hits = [];
    flat.forEach(d => {
      let score = -1;
      if (d.t.includes(term)) score = 0;
      else if ((d.s || '').includes(term)) score = 1;
      else if ((d.use || '').includes(term) || (d.d || '').includes(term) || (d.not || '').includes(term)) score = 2;
      if (score >= 0) hits.push([score + (d.k === 'fang' ? 0 : 0.5), d]);
    });
    hits.sort((a, b) => a[0] - b[0]);
    results.innerHTML = hits.length
      ? hits.slice(0, 16).map(([, d]) => {
        const path = ancestors(d).slice(1).map(a => a.t).join(' › ');
        return `<button role="option" data-go="${d.id}"><span class="r-t">${esc(d.t)}</span>${d.s ? `<span class="r-s">${esc(clip(d.s, 22))}</span>` : ''}<span class="r-p">${esc(path)}</span></button>`;
      }).join('')
      : '<div class="r-none">没有找到。换个方名或症状试试。</div>';
    results.hidden = false;
  }
  q.addEventListener('input', search);
  q.addEventListener('focus', () => { if (q.value.trim()) search(); });
  results.addEventListener('click', e => {
    const b = e.target.closest('[data-go]');
    if (!b) return;
    results.hidden = true;
    goTo(b.getAttribute('data-go'));
  });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) results.hidden = true; });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape') { if (!results.hidden) results.hidden = true; else if (!panel.hidden) closePanel(); }
  });

  // ---------- start
  update(null, true);
  if (phone()) setView('outline');
  else { select(DATA); fit(true); }
  const refit = () => { mcache.clear(); update(null, true); if (!touched) fit(true); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (!touched && view === 'map') fit(true); }, 150); });
})();
</script>
